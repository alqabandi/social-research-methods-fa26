<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600" width="1200" height="600">
  <title>The divorce study: from the frame to completed interviews</title>
  <desc>A probability sample was drawn from official records; only some interviews were completed, and cases were lost to refusal, a changed address, or family circumstances.</desc>
  <style>
    text { font-family:'Noto Sans','Helvetica Neue',Arial,sans-serif; text-anchor:middle; }
    .panel { fill:#fffdf8; stroke:#c9ced6; stroke-width:2; }
    .head { font-size:22px; font-weight:700; fill:#1B2A4A; }
    .sub { font-size:17px; font-weight:600; fill:#1B2A4A; }
    .drop { font-size:17px; font-weight:700; fill:#C65D4B; }
    .note { font-size:20px; font-weight:700; fill:#1B2A4A; }
    .halo { fill:#e9c46a; opacity:0.55; }
    .flow { stroke:#A47712; stroke-width:7; stroke-linecap:round; fill:none; }
    .branch { stroke:#C65D4B; stroke-width:4; stroke-linecap:round; fill:none; }
  </style>
  <defs>
    <symbol id="person" viewBox="-14 -21 28 36" overflow="visible">
      <circle cx="0" cy="-12" r="8"/>
      <path d="M -13 14 Q -13 -1 0 -1 Q 13 -1 13 14 Z"/>
    </symbol>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#A47712"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C65D4B"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#FCFCFA"/>

  <g transform="matrix(-1 0 0 1 1200 0)">
    <rect class="panel" x="860" y="90" width="280" height="240" rx="16"/>
    <circle class="halo" cx="972" cy="157" r="26"/><circle class="halo" cx="1082" cy="157" r="26"/>
    <circle class="halo" cx="917" cy="222" r="26"/><circle class="halo" cx="1027" cy="222" r="26"/>
    <circle class="halo" cx="972" cy="287" r="26"/><circle class="halo" cx="1082" cy="287" r="26"/>
    <g fill="#1B2A4A">
      <use href="#person" xlink:href="#person" x="900" y="138" width="34" height="44"/><use href="#person" xlink:href="#person" x="955" y="138" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="1010" y="138" width="34" height="44"/><use href="#person" xlink:href="#person" x="1065" y="138" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="900" y="203" width="34" height="44"/><use href="#person" xlink:href="#person" x="955" y="203" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="1010" y="203" width="34" height="44"/><use href="#person" xlink:href="#person" x="1065" y="203" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="900" y="268" width="34" height="44"/><use href="#person" xlink:href="#person" x="955" y="268" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="1010" y="268" width="34" height="44"/><use href="#person" xlink:href="#person" x="1065" y="268" width="34" height="44"/>
    </g>
    <line class="flow" x1="850" y1="210" x2="796" y2="210" marker-end="url(#arrowhead)"/>

    <rect class="panel" x="500" y="90" width="280" height="240" rx="16"/>
    <circle class="halo" cx="580" cy="175" r="26"/><circle class="halo" cx="640" cy="175" r="26"/><circle class="halo" cx="700" cy="175" r="26"/>
    <circle class="halo" cx="580" cy="255" r="26"/><circle class="halo" cx="640" cy="255" r="26"/><circle class="halo" cx="700" cy="255" r="26"/>
    <g fill="#1B2A4A">
      <use href="#person" xlink:href="#person" x="563" y="156" width="34" height="44"/><use href="#person" xlink:href="#person" x="623" y="156" width="34" height="44"/><use href="#person" xlink:href="#person" x="683" y="156" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="563" y="236" width="34" height="44"/><use href="#person" xlink:href="#person" x="623" y="236" width="34" height="44"/><use href="#person" xlink:href="#person" x="683" y="236" width="34" height="44"/>
    </g>
    <line class="flow" x1="490" y1="210" x2="356" y2="210" marker-end="url(#arrowhead)"/>

    <rect class="panel" x="60" y="90" width="280" height="240" rx="16"/>
    <g fill="#147D79">
      <use href="#person" xlink:href="#person" x="113" y="196" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="183" y="196" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="253" y="196" width="34" height="44"/>
    </g>

    <path class="branch" d="M 640 335 V 385"/>
    <path class="branch" d="M 270 385 H 690"/>
    <path class="branch" d="M 690 385 V 418" marker-end="url(#arrowred)"/>
    <path class="branch" d="M 480 385 V 418" marker-end="url(#arrowred)"/>
    <path class="branch" d="M 270 385 V 418" marker-end="url(#arrowred)"/>
    <line x1="790" y1="477" x2="805" y2="477" stroke="#C65D4B" stroke-width="3" stroke-linecap="round"/>
    <g fill="#FCEDEA" stroke="#C65D4B" stroke-width="2">
      <rect x="605" y="430" width="170" height="95" rx="12"/>
      <rect x="395" y="430" width="170" height="95" rx="12"/>
      <rect x="185" y="430" width="170" height="95" rx="12"/>
    </g>
    <g fill="#9aa3ad">
      <use href="#person" xlink:href="#person" x="673" y="446" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="463" y="446" width="34" height="44"/>
      <use href="#person" xlink:href="#person" x="253" y="446" width="34" height="44"/>
    </g>
  </g>

  <text class="head" x="200" y="62">Sampling frame</text>
  <text class="head" x="560" y="62">Probability sample drawn</text>
  <text class="head" x="1000" y="62">Completed interviews</text>
  <text class="sub" x="200" y="360">Official records</text>
  <text class="sub" x="777" y="190">Completed</text>

  <text class="drop" x="383" y="483" style="text-anchor:end">Not completed</text>
  <text class="sub" x="510" y="512">Refused</text>
  <text class="sub" x="720" y="512">Moved away</text>
  <text class="sub" x="930" y="512" style="font-size:15px">Family circumstances</text>

  <text class="note" x="600" y="572">Do those who were missed differ from those who took part in ways that matter for the results?</text>
</svg>
