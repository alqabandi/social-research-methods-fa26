<svg direction="rtl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <title>الشعبة لا تمثل الجامعة</title>
  <desc>مخطط لجامعة فيها ثماني كليات. تظهر شعبتان فقط مضاءتان داخل كلية العلوم الاجتماعية، وتحتها ثلاثة أسباب لاختلاف طلبتهما عن طلبة الجامعة: كلية واحدة، وأوقات ومراحل محددة، وطلبة سجّلوا مقررات هذا الأستاذ.</desc>
  <style>
    text { font-family:'Noto Kufi Arabic','Geeza Pro','IBM Plex Sans Arabic',Arial,sans-serif; text-anchor:middle; }
    .bldg { fill:#D7DBE0; stroke:#B5BCC5; stroke-width:2; }
    .bldg-label { font-size:19px; font-weight:700; fill:#6F7985; }
    .room { fill:#FFFFFF; stroke:#9aa3ad; stroke-width:1.5; }
    .head { font-size:24px; font-weight:700; fill:#1B2A4A; }
    .pill { fill:#FFFFFF; stroke:#A47712; stroke-width:2.5; }
    .pill-text { font-size:18px; font-weight:700; fill:#1B2A4A; }
    .note { font-size:20px; font-weight:700; fill:#1B2A4A; }
  </style>

  <rect width="1200" height="600" fill="#FCFCFA"/>
  <text class="head" x="600" y="44">الجامعة</text>
  <rect x="40" y="65" width="1120" height="405" rx="30" fill="#EEF2F7"/>

  <!-- highlighted college -->
  <rect x="880" y="95" width="250" height="160" rx="12" fill="#EAF6F5" stroke="#147D79" stroke-width="3"/>
  <text x="1005" y="128" font-size="18" font-weight="700" fill="#147D79">كلية العلوم الاجتماعية</text>
  <rect class="room" x="915" y="150" width="56" height="34" rx="4"/>
  <rect class="room" x="977" y="150" width="56" height="34" rx="4"/>
  <rect x="1039" y="150" width="56" height="34" rx="4" fill="#e9c46a" stroke="#A47712" stroke-width="3"/>
  <rect class="room" x="915" y="192" width="56" height="34" rx="4"/>
  <rect x="977" y="192" width="56" height="34" rx="4" fill="#e9c46a" stroke="#A47712" stroke-width="3"/>
  <rect class="room" x="1039" y="192" width="56" height="34" rx="4"/>
  <text x="1005" y="246" font-size="14" font-weight="700" fill="#A47712">شُعب الأستاذ: 200 طالب</text>

  <!-- other colleges -->
  <rect class="bldg" x="610" y="95" width="250" height="160" rx="12"/>
  <rect class="bldg" x="340" y="95" width="250" height="160" rx="12"/>
  <rect class="bldg" x="70" y="95" width="250" height="160" rx="12"/>
  <rect class="bldg" x="880" y="280" width="250" height="160" rx="12"/>
  <rect class="bldg" x="610" y="280" width="250" height="160" rx="12"/>
  <rect class="bldg" x="340" y="280" width="250" height="160" rx="12"/>
  <rect class="bldg" x="70" y="280" width="250" height="160" rx="12"/>
  <text class="bldg-label" x="735" y="182">الآداب</text>
  <text class="bldg-label" x="465" y="182">العلوم</text>
  <text class="bldg-label" x="195" y="182">الهندسة والبترول</text>
  <text class="bldg-label" x="1005" y="367">العلوم الإدارية</text>
  <text class="bldg-label" x="735" y="367">الحقوق</text>
  <text class="bldg-label" x="465" y="367">التربية</text>
  <text class="bldg-label" x="195" y="367">الطب والعلوم الصحية</text>

  <!-- why the section differs -->
  <rect class="pill" x="830" y="492" width="300" height="48" rx="24"/>
  <rect class="pill" x="450" y="492" width="300" height="48" rx="24"/>
  <rect class="pill" x="70" y="492" width="300" height="48" rx="24"/>
  <text class="pill-text" x="980" y="523">كلية واحدة</text>
  <text class="pill-text" x="600" y="523">أوقات ومراحل محددة</text>
  <text class="pill-text" x="220" y="523">طلبة سجّلوا مقرراته</text>

  <text class="note" x="600" y="582">200 استبانة من مقررات أستاذ واحد لا تصف طلبة الجامعة كلها</text>
</svg>
