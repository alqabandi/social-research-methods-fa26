<svg direction="rtl" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 540" width="1200" height="540">
  <title>الترشيح يحتاج حماية</title>
  <desc>نتجنب أن يسلم المشارك قائمة بأسماء الآخرين وأرقامهم. ونفضّل أن يمرر بطاقة دعوة تحمل رمزًا، فيقرر المدعو بنفسه إن كان سيتواصل مع فريق البحث.</desc>
  <style>
    text { font-family:'Noto Kufi Arabic','Geeza Pro','IBM Plex Sans Arabic',Arial,sans-serif; text-anchor:middle; }
    .title-bad { font-size:28px; font-weight:700; fill:#C65D4B; }
    .title-good { font-size:28px; font-weight:700; fill:#147D79; }
    .paper-head { font-size:17px; font-weight:700; fill:#1B2A4A; }
    .field { font-size:15px; font-weight:600; fill:#6F7985; }
    .card-text { font-size:16px; font-weight:600; fill:#1B2A4A; }
    .card-small { font-size:14px; font-weight:600; fill:#6F7985; }
    .who { font-size:17px; font-weight:700; fill:#1B2A4A; }
    .sub { font-size:18px; font-weight:600; fill:#1B2A4A; }
  </style>
  <defs>
    <symbol id="person" viewBox="-14 -21 28 36" overflow="visible">
      <circle cx="0" cy="-12" r="8"/>
      <path d="M -13 14 Q -13 -1 0 -1 Q 13 -1 13 14 Z"/>
    </symbol>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#147D79"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#FCFCFA"/>
  <line x1="600" y1="30" x2="600" y2="510" stroke="#c9ced6" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Avoid: list of names (right) -->
  <text class="title-bad" x="900" y="58">نتجنب</text>
  <rect x="740" y="90" width="320" height="350" rx="16" fill="#D9C7A0"/>
  <rect x="760" y="115" width="280" height="310" rx="8" fill="#FFFFFF"/>
  <rect x="860" y="80" width="80" height="28" rx="7" fill="#6F7985"/>
  <text class="paper-head" x="900" y="155">رشّح ثلاثة من معارفك</text>
  <line x1="780" y1="170" x2="1020" y2="170" stroke="#1B2A4A" stroke-width="1.5"/>
  <g>
    <text class="field" x="995" y="205">الاسم:</text><rect x="785" y="193" width="170" height="12" rx="6" fill="#C7CDD4"/>
    <text class="field" x="995" y="235">الهاتف:</text><rect x="785" y="223" width="140" height="12" rx="6" fill="#C7CDD4"/>
    <text class="field" x="995" y="285">الاسم:</text><rect x="785" y="273" width="150" height="12" rx="6" fill="#C7CDD4"/>
    <text class="field" x="995" y="315">الهاتف:</text><rect x="785" y="303" width="140" height="12" rx="6" fill="#C7CDD4"/>
    <text class="field" x="995" y="365">الاسم:</text><rect x="785" y="353" width="160" height="12" rx="6" fill="#C7CDD4"/>
    <text class="field" x="995" y="395">الهاتف:</text><rect x="785" y="383" width="140" height="12" rx="6" fill="#C7CDD4"/>
  </g>
  <g stroke="#C65D4B" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="770" y1="125" x2="1030" y2="415"/>
    <line x1="1030" y1="125" x2="770" y2="415"/>
  </g>
  <text class="sub" x="900" y="478">قائمة بأسماء الآخرين وأرقامهم</text>
  <text class="sub" x="900" y="506">تكشفهم قبل أن يوافقوا</text>

  <!-- Prefer: invitation card (left) -->
  <text class="title-good" x="300" y="58">نفضّل</text>
  <use href="#person" xlink:href="#person" x="462" y="205" width="56" height="72" fill="#1B2A4A"/>
  <text class="who" x="490" y="305">المشارك</text>
  <use href="#person" xlink:href="#person" x="82" y="205" width="56" height="72" fill="#147D79"/>
  <text class="who" x="110" y="305">شخص يعرفه</text>

  <rect x="170" y="130" width="260" height="165" rx="14" fill="#FFFFFF" stroke="#147D79" stroke-width="3"/>
  <path d="M 184 130 H 416 Q 430 130 430 144 V 172 H 170 V 144 Q 170 130 184 130 Z" fill="#147D79"/>
  <text x="300" y="159" font-size="18" font-weight="700" fill="#FFFFFF">بطاقة دعوة</text>
  <text class="card-text" x="300" y="205">دعوة للمشاركة في دراسة</text>
  <text x="300" y="245" direction="ltr" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A" letter-spacing="2">K-4827</text>
  <text class="card-small" x="300" y="280">التواصل مع الفريق اختياري</text>

  <line x1="430" y1="345" x2="180" y2="345" stroke="#147D79" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <text class="who" x="305" y="380">يمرّر البطاقة</text>

  <text class="sub" x="300" y="478">الرمز يربط الدعوة بالمرشِّح دون أي اسم</text>
  <text class="sub" x="300" y="506">والمدعو يقرر بنفسه إن كان سيتواصل</text>
</svg>
