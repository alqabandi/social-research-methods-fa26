<svg direction="rtl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590">
  <title>استطلاع مجلة ليتراري دايجست عام 1936</title>
  <desc>اختارت المجلة أسماء من أدلة الهاتف وسجلات السيارات وقوائم أخرى، وأرسلت نحو عشرة ملايين بطاقة، فعاد نحو 2.4 مليون. توقعت أن يحصل لاندون على 57 بالمئة من أصوات المرشحين، فحصل فعليًا على نحو 37 بالمئة.</desc>
  <style>
    text { font-family:'Noto Kufi Arabic','Geeza Pro','IBM Plex Sans Arabic',Arial,sans-serif; text-anchor:middle; }
    .head { font-size:22px; font-weight:700; fill:#1B2A4A; }
    .list { font-size:16px; font-weight:700; fill:#1B2A4A; }
    .sub { font-size:17px; font-weight:600; fill:#1B2A4A; }
    .big { font-size:26px; font-weight:700; }
    .note { font-size:20px; font-weight:700; fill:#1B2A4A; }
    .src { font-family:Arial, sans-serif; font-size:13px; fill:#6F7985; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#A47712"/>
    </marker>
  </defs>

  <rect width="1200" height="590" fill="#FCFCFA"/>

  <text class="head" x="1040" y="70">١. من أين اختاروا؟</text>
  <text class="head" x="790" y="70">٢. كيف دعوهم؟</text>
  <text class="head" x="540" y="70">٣. من استجاب؟</text>
  <text class="head" x="245" y="70">التوقع والنتيجة</text>

  <!-- Stage 1: frame -->
  <rect x="950" y="130" width="180" height="300" rx="16" fill="#FFF7E3" stroke="#A47712" stroke-width="3"/>
  <g fill="#FFFFFF" stroke="#A47712" stroke-width="2">
    <rect x="965" y="160" width="150" height="60" rx="8"/>
    <rect x="965" y="250" width="150" height="60" rx="8"/>
    <rect x="965" y="340" width="150" height="60" rx="8"/>
  </g>
  <text class="list" x="1040" y="196">أدلة الهاتف</text>
  <text class="list" x="1040" y="286">سجلات السيارات</text>
  <text class="list" x="1040" y="376">قوائم أخرى</text>
  <line x1="940" y1="280" x2="878" y2="280" stroke="#A47712" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Stage 2 -> 3 funnel -->
  <polygon points="720,130 720,430 610,430 610,358" fill="#1B2A4A" opacity="0.08"/>
  <rect x="720" y="130" width="140" height="300" rx="6" fill="#1B2A4A"/>
  <text class="big" x="790" y="275" fill="#FFFFFF">10</text>
  <text class="sub" x="790" y="305" fill="#FFFFFF" style="fill:#FFFFFF">ملايين بطاقة</text>

  <rect x="470" y="130" width="140" height="228" rx="6" fill="none" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="sub" x="540" y="250" style="fill:#8c96a3">لم تعد</text>
  <rect x="470" y="358" width="140" height="72" rx="6" fill="#e9c46a" stroke="#1B2A4A" stroke-width="1.6"/>
  <text class="big" x="540" y="403" fill="#1B2A4A" style="font-size:22px">2.4 مليون</text>

  <text class="sub" x="1040" y="468">قوائم تميل إلى الأيسر حالًا</text>
  <text class="sub" x="790" y="468">أُرسلت بالبريد</text>
  <text class="sub" x="540" y="468">عادت طوعًا (نحو 24%)</text>

  <!-- Results -->
  <line x1="95" y1="430" x2="395" y2="430" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="120" y1="230" x2="395" y2="230" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="100" y="236" direction="ltr" font-family="Arial, sans-serif" font-size="14" fill="#6F7985">50%</text>
  <rect x="270" y="202" width="90" height="228" rx="6" fill="#C65D4B"/>
  <rect x="140" y="282" width="90" height="148" rx="6" fill="#147D79"/>
  <text class="big" x="315" y="190" fill="#C65D4B" direction="ltr">57%</text>
  <text class="big" x="185" y="270" fill="#147D79" direction="ltr">37%</text>
  <text class="sub" x="315" y="458">توقع المجلة</text>
  <text class="sub" x="185" y="458">النتيجة الفعلية</text>
  <text class="sub" x="245" y="488" style="font-size:15px">حصة لاندون من أصوات المرشحَين</text>

  <text class="note" x="600" y="535">الحجم الضخم لم يعالج تحيز القوائم ولا تحيز من اختار أن يرد</text>
  <text class="src" x="600" y="572" direction="ltr">Sources: The Literary Digest, Oct. 31, 1936; Squire, P. (1988). Why the 1936 Literary Digest poll failed. Public Opinion Quarterly, 52(1), 125–133.</text>
</svg>
