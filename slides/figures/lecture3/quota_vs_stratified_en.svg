<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" width="1200" height="560">
  <title>Quota sampling is not stratified sampling</title>
  <desc>In stratified sampling, four people per group are drawn at random from across the whole group. In quota sampling, four people per group are also chosen, but all of them are the ones closest to the mall entrance where the interviewer stands.</desc>
  <style>
    text { font-family:'Noto Sans','Helvetica Neue',Arial,sans-serif; text-anchor:middle; }
    .panel { fill:#fffdf8; stroke:#c9ced6; stroke-width:2; }
    .head { fill:#1B2A4A; }
    .label { font-size:24px; font-weight:700; fill:#ffffff; }
    .band-label { font-size:16px; font-weight:700; fill:#1B2A4A; }
    .sub { font-size:17px; font-weight:600; fill:#1B2A4A; }
    .note { font-size:20px; font-weight:700; fill:#1B2A4A; }
    .dot { fill:#d7dbe0; stroke:#8c96a3; stroke-width:1.3; }
    .sel { fill:#e9c46a; stroke:#1B2A4A; stroke-width:1.6; }
  </style>
  <defs>
    <symbol id="person" viewBox="-14 -21 28 36" overflow="visible">
      <circle cx="0" cy="-12" r="8"/>
      <path d="M -13 14 Q -13 -1 0 -1 Q 13 -1 13 14 Z"/>
    </symbol>
  </defs>

  <rect width="1200" height="560" fill="#FCFCFA"/>

  <g transform="matrix(-1 0 0 1 1200 0)">
    <!-- Stratified -->
    <rect class="panel" x="620" y="20" width="560" height="480" rx="16"/>
    <rect class="head" x="620" y="20" width="560" height="64" rx="16"/>
    <rect x="640" y="110" width="520" height="140" rx="12" fill="#2a9d8f" opacity="0.22"/>
    <rect x="640" y="270" width="520" height="140" rx="12" fill="#e76f51" opacity="0.22"/>
    <circle class="dot" cx="668" cy="155" r="11"/><circle class="sel" cx="720" cy="155" r="11"/><circle class="dot" cx="772" cy="155" r="11"/><circle class="dot" cx="824" cy="155" r="11"/><circle class="dot" cx="876" cy="155" r="11"/><circle class="sel" cx="928" cy="155" r="11"/><circle class="dot" cx="980" cy="155" r="11"/><circle class="dot" cx="1032" cy="155" r="11"/>
    <circle class="dot" cx="668" cy="205" r="11"/><circle class="dot" cx="720" cy="205" r="11"/><circle class="dot" cx="772" cy="205" r="11"/><circle class="sel" cx="824" cy="205" r="11"/><circle class="dot" cx="876" cy="205" r="11"/><circle class="dot" cx="928" cy="205" r="11"/><circle class="dot" cx="980" cy="205" r="11"/><circle class="sel" cx="1032" cy="205" r="11"/>
    <circle class="sel" cx="668" cy="315" r="11"/><circle class="dot" cx="720" cy="315" r="11"/><circle class="dot" cx="772" cy="315" r="11"/><circle class="dot" cx="824" cy="315" r="11"/><circle class="sel" cx="876" cy="315" r="11"/><circle class="dot" cx="928" cy="315" r="11"/><circle class="dot" cx="980" cy="315" r="11"/><circle class="dot" cx="1032" cy="315" r="11"/>
    <circle class="dot" cx="668" cy="365" r="11"/><circle class="dot" cx="720" cy="365" r="11"/><circle class="sel" cx="772" cy="365" r="11"/><circle class="dot" cx="824" cy="365" r="11"/><circle class="dot" cx="876" cy="365" r="11"/><circle class="dot" cx="928" cy="365" r="11"/><circle class="sel" cx="980" cy="365" r="11"/><circle class="dot" cx="1032" cy="365" r="11"/>

    <!-- Quota -->
    <rect class="panel" x="20" y="20" width="560" height="480" rx="16"/>
    <rect class="head" x="20" y="20" width="560" height="64" rx="16"/>
    <rect x="40" y="110" width="440" height="140" rx="12" fill="#2a9d8f" opacity="0.22"/>
    <rect x="40" y="270" width="440" height="140" rx="12" fill="#e76f51" opacity="0.22"/>
    <circle class="dot" cx="66" cy="155" r="11"/><circle class="dot" cx="106" cy="155" r="11"/><circle class="dot" cx="146" cy="155" r="11"/><circle class="dot" cx="186" cy="155" r="11"/><circle class="dot" cx="226" cy="155" r="11"/><circle class="dot" cx="266" cy="155" r="11"/><circle class="sel" cx="306" cy="155" r="11"/><circle class="sel" cx="346" cy="155" r="11"/>
    <circle class="dot" cx="66" cy="205" r="11"/><circle class="dot" cx="106" cy="205" r="11"/><circle class="dot" cx="146" cy="205" r="11"/><circle class="dot" cx="186" cy="205" r="11"/><circle class="dot" cx="226" cy="205" r="11"/><circle class="dot" cx="266" cy="205" r="11"/><circle class="sel" cx="306" cy="205" r="11"/><circle class="sel" cx="346" cy="205" r="11"/>
    <circle class="dot" cx="66" cy="315" r="11"/><circle class="dot" cx="106" cy="315" r="11"/><circle class="dot" cx="146" cy="315" r="11"/><circle class="dot" cx="186" cy="315" r="11"/><circle class="dot" cx="226" cy="315" r="11"/><circle class="dot" cx="266" cy="315" r="11"/><circle class="sel" cx="306" cy="315" r="11"/><circle class="sel" cx="346" cy="315" r="11"/>
    <circle class="dot" cx="66" cy="365" r="11"/><circle class="dot" cx="106" cy="365" r="11"/><circle class="dot" cx="146" cy="365" r="11"/><circle class="dot" cx="186" cy="365" r="11"/><circle class="dot" cx="226" cy="365" r="11"/><circle class="dot" cx="266" cy="365" r="11"/><circle class="sel" cx="306" cy="365" r="11"/><circle class="sel" cx="346" cy="365" r="11"/>
    <rect x="500" y="162" width="60" height="196" rx="6" fill="#D9C7A0" stroke="#A47712" stroke-width="3"/>
    <line x1="530" y1="162" x2="530" y2="358" stroke="#A47712" stroke-width="3"/>
    <circle cx="522" cy="262" r="3.5" fill="#A47712"/><circle cx="538" cy="262" r="3.5" fill="#A47712"/>
    <use href="#person" xlink:href="#person" x="512" y="364" width="36" height="46" fill="#C65D4B"/>
  </g>

  <text class="label" x="300" y="62">Stratified</text>
  <text class="band-label" x="88" y="186">Kuwaiti</text>
  <text class="band-label" x="92" y="346">Non-</text>
  <text class="band-label" x="92" y="366">Kuwaiti</text>
  <text class="sub" x="300" y="448">Four per group, drawn at random</text>
  <text class="sub" x="300" y="476">everyone in the group has a known chance</text>

  <text class="label" x="900" y="62">Quota</text>
  <text class="band-label" x="782" y="186">Kuwaiti</text>
  <text class="band-label" x="782" y="346">Non-</text>
  <text class="band-label" x="782" y="366">Kuwaiti</text>
  <text class="band-label" x="670" y="126">Mall</text>
  <text class="band-label" x="670" y="148">entrance</text>
  <text class="sub" x="900" y="448">Four per group: quota filled</text>
  <text class="sub" x="900" y="476">but only people who passed the interviewer and agreed</text>

  <text class="note" x="600" y="538">Same number per group; the difference is how people are chosen within it</text>
</svg>
