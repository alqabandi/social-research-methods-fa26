<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 540" width="1200" height="540">
  <title>Referrals need protection</title>
  <desc>Avoid asking a participant to hand over a list of other people's names and phone numbers. Prefer having the participant pass on an invitation card with a code, so the invitee decides whether to contact the research team.</desc>
  <style>
    text { font-family:'Noto Sans','Helvetica Neue',Arial,sans-serif; text-anchor:middle; }
    .title-bad { font-size:28px; font-weight:700; fill:#C65D4B; }
    .title-good { font-size:28px; font-weight:700; fill:#147D79; }
    .paper-head { font-size:17px; font-weight:700; fill:#1B2A4A; }
    .field { font-size:15px; font-weight:600; fill:#6F7985; }
    .card-text { font-size:16px; font-weight:600; fill:#1B2A4A; }
    .card-small { font-size:14px; font-weight:600; fill:#6F7985; }
    .who { font-size:17px; font-weight:700; fill:#1B2A4A; }
    .sub { font-size:18px; font-weight:600; fill:#1B2A4A; }
  </style>
  <defs>
    <symbol id="person" viewBox="-14 -21 28 36" overflow="visible">
      <circle cx="0" cy="-12" r="8"/>
      <path d="M -13 14 Q -13 -1 0 -1 Q 13 -1 13 14 Z"/>
    </symbol>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#147D79"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#FCFCFA"/>

  <g transform="matrix(-1 0 0 1 1200 0)">
    <line x1="600" y1="30" x2="600" y2="510" stroke="#c9ced6" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="740" y="90" width="320" height="350" rx="16" fill="#D9C7A0"/>
    <rect x="760" y="115" width="280" height="310" rx="8" fill="#FFFFFF"/>
    <rect x="860" y="80" width="80" height="28" rx="7" fill="#6F7985"/>
    <line x1="780" y1="170" x2="1020" y2="170" stroke="#1B2A4A" stroke-width="1.5"/>
    <rect x="785" y="193" width="170" height="12" rx="6" fill="#C7CDD4"/>
    <rect x="785" y="223" width="140" height="12" rx="6" fill="#C7CDD4"/>
    <rect x="785" y="273" width="150" height="12" rx="6" fill="#C7CDD4"/>
    <rect x="785" y="303" width="140" height="12" rx="6" fill="#C7CDD4"/>
    <rect x="785" y="353" width="160" height="12" rx="6" fill="#C7CDD4"/>
    <rect x="785" y="383" width="140" height="12" rx="6" fill="#C7CDD4"/>
    <g stroke="#C65D4B" stroke-width="12" stroke-linecap="round" opacity="0.85">
      <line x1="770" y1="125" x2="1030" y2="415"/>
      <line x1="1030" y1="125" x2="770" y2="415"/>
    </g>

    <use href="#person" xlink:href="#person" x="462" y="205" width="56" height="72" fill="#1B2A4A"/>
    <use href="#person" xlink:href="#person" x="82" y="205" width="56" height="72" fill="#147D79"/>
    <rect x="170" y="130" width="260" height="165" rx="14" fill="#FFFFFF" stroke="#147D79" stroke-width="3"/>
    <path d="M 184 130 H 416 Q 430 130 430 144 V 172 H 170 V 144 Q 170 130 184 130 Z" fill="#147D79"/>
    <line x1="430" y1="345" x2="180" y2="345" stroke="#147D79" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Avoid (left) -->
  <text class="title-bad" x="300" y="58">Avoid</text>
  <text class="paper-head" x="300" y="155">Refer three people you know</text>
  <text class="field" x="203" y="205">Name:</text>
  <text class="field" x="203" y="235">Phone:</text>
  <text class="field" x="203" y="285">Name:</text>
  <text class="field" x="203" y="315">Phone:</text>
  <text class="field" x="203" y="365">Name:</text>
  <text class="field" x="203" y="395">Phone:</text>
  <text class="sub" x="300" y="478">A list of other people's names and numbers</text>
  <text class="sub" x="300" y="506">exposes them before they agree</text>

  <!-- Prefer (right) -->
  <text class="title-good" x="900" y="58">Prefer</text>
  <text class="who" x="710" y="305">Participant</text>
  <text class="who" x="1090" y="305">Someone</text>
  <text class="who" x="1090" y="326">they know</text>
  <text x="900" y="159" font-size="18" font-weight="700" fill="#FFFFFF">Invitation card</text>
  <text class="card-text" x="900" y="205">You're invited to a study</text>
  <text x="900" y="245" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A" letter-spacing="2">K-4827</text>
  <text class="card-small" x="900" y="280">Contacting the team is optional</text>
  <text class="who" x="895" y="380">passes the card on</text>
  <text class="sub" x="900" y="478">The code links invitations without any names</text>
  <text class="sub" x="900" y="506">and the invitee decides whether to get in touch</text>
</svg>
