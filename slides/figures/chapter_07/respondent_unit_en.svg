<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" xml:lang="en" lang="en" font-family='Arial, Helvetica, sans-serif'>
<title id="t">Respondent versus unit of analysis</title>
<desc id="d">Three examples. A school director fills in the questionnaire, but the unit of analysis is the school, with data on teachers, absence policy and activities. A household member answers for the household, the unit, with data on income, size and housing. An employee answers for the organization, the unit, with data on staff size, policies and structure. In each unit icon the respondent appears as one highlighted member among others. Message: the person who answers is not always the unit we draw conclusions about.</desc>
