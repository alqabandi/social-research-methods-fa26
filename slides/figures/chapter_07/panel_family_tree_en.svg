<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" xml:lang="en" lang="en" font-family='Arial, Helvetica, sans-serif'>
<title id="t">Schematic household panel growing across generations</title>
<desc id="d">A schematic, not actual PSID data. Four waves run left to right over 30 years. Wave 1 interviews two original sample families, A and B, drawn as gold houses with parents and children inside. Grey lines show each household re-interviewed in the next wave. As children grow up and move out, dashed teal lines lead to new teal households that join the panel, including a third-generation household by wave 4. The panel grows from 2 to 3, 5 and 7 households.</desc>
