<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" xml:lang="ar" lang="ar" direction="rtl" font-family='Arial, "Noto Sans Arabic", sans-serif'>
<title id="t">خطوات المسح الاثنتا عشرة مجمّعة في أربع مراحل</title>
<desc id="d">أربعة أعمدة ملونة تُقرأ من اليمين إلى اليسار. المرحلة 1، السؤال والمفاهيم: تحديد المشكلة، والأسئلة والفروض، والتعريف الإجرائي للمتغيرات، وخطة البحث. المرحلة 2، المجتمع والعينة والأداة: المجتمع والوحدة ونمط العينة، والأدوات والمقاييس، وخطة التحليل. المرحلة 3، الاختبار الأولي والعمل الميداني: اختبار أولي وتدريب الفريق، ثم جمع البيانات. ويبيّن سهم متقطع أن مشكلات الاختبار الأولي تعيد الباحث إلى الخطوات 5 إلى 7. المرحلة 4: التحليل والتفسير وكتابة التقرير. الرسالة: التنظيم الجيد في آخر السلسلة لا يصلح خطأً أساسيًا في بدايتها.</desc>
