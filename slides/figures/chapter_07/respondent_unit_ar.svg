<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" xml:lang="ar" lang="ar" direction="rtl" font-family='Arial, "Noto Sans Arabic", sans-serif'>
<title id="t">المجيب ووحدة التحليل</title>
<desc id="d">ثلاثة أمثلة. مدير المدرسة يملأ الاستبانة، لكن وحدة التحليل هي المدرسة، والبيانات عن المعلمين وسياسة الغياب والأنشطة. أحد أفراد الأسرة يجيب نيابة عن الأسرة، وهي الوحدة، والبيانات عن الدخل وعدد الأفراد والسكن. موظف يجيب عن مؤسسته، وهي الوحدة، والبيانات عن عدد العاملين والسياسات والهيكل. ويظهر المجيب داخل كل وحدة عضوًا مميزًا بين آخرين. الرسالة: من يجيب عن الأسئلة ليس دائمًا الوحدة التي نستنتج عنها.</desc>
