<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" xml:lang="ar" lang="ar" direction="rtl" font-family='Arial, "Noto Sans Arabic", sans-serif'>
<title id="t">المسح ودراسة الحالة: التوحيد والتعمق قوتان متكاملتان</title>
<desc id="d">سهم ذو اتجاهين يمتد من التوحيد عبر حالات كثيرة إلى التعمق في حالات قليلة. لوحة المسح تعرض أشخاصًا كثيرين متماثلين، وتذكر التوحيد وقابلية المقارنة والاتساع؛ وتجيب عن: كم؟ وما مدى الانتشار؟ وهل تختلف الفئات؟ لكنها قد تفوّت المعنى وراء البدائل الموحدة. لوحة دراسة الحالة والمقابلة المعمقة تعرض شخصًا واحدًا داخل طبقات من السياق، وتذكر السياق والعملية والمعنى؛ لكنها قد تفوّت الاتساع والمقارنة. يبيّن سهمان أن التعمق يحسّن أسئلة المسح، وأن الاتساع يبيّن مدى انتشار النمط. الرسالة: الفرق ليس علميًا مقابل غير علمي، بل نوع الدليل.</desc>
