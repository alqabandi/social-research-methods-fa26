<text x="817.5" y="230.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="817.5" dy="0.0">Travel needed; works</tspan><tspan x="817.5" dy="22.1">for non-readers</tspan></text>
<text x="817.5" y="322.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="817.5" dy="0.0">Clarify and</tspan><tspan x="817.5" dy="22.1">follow up</tspan></text>
<text x="817.5" y="414.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="817.5" dy="0.0">Interviewer</tspan><tspan x="817.5" dy="22.1">is present</tspan></text>
<text x="817.5" y="506.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="817.5" dy="0.0">Costly; tight</tspan><tspan x="817.5" dy="22.1">control of question path</tspan></text>
