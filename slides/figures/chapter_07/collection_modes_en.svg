<text x="600.0" y="600.0" font-size="20" fill="#1B2A4A" font-weight="bold" text-anchor="middle"><tspan x="600.0" dy="0.0">No universal ranking: choose by population, topic sensitivity,</tspan></text>
<text x="600.0" y="628.0" font-size="20" fill="#1B2A4A" font-weight="bold" text-anchor="middle"><tspan x="600.0" dy="0.0">question complexity, cost, and the response quality you need.</tspan></text>
