<text x="327.5" y="158.0" font-size="16" fill="#6F7985" font-weight="normal" text-anchor="middle"><tspan x="327.5" dy="0.0">interviewer by phone</tspan></text>
<text x="327.5" y="230.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="327.5" dy="0.0">Wide areas; unknown</tspan><tspan x="327.5" dy="22.1">numbers often refused</tspan></text>
<text x="327.5" y="322.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="327.5" dy="0.0">Interviewer</tspan><tspan x="327.5" dy="22.1">can clarify</tspan></text>
<text x="327.5" y="414.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="327.5" dy="0.0">Others may</tspan><tspan x="327.5" dy="22.1">overhear</tspan></text>
<text x="327.5" y="506.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="327.5" dy="0.0">Often cheaper;</tspan><tspan x="327.5" dy="22.1">central supervision</tspan></text>
