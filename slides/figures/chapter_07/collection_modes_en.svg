<text x="572.5" y="132.0" font-size="22" fill="#A47712" font-weight="bold" text-anchor="middle"><tspan x="572.5" dy="0.0">Self-administered</tspan></text>
<text x="572.5" y="158.0" font-size="16" fill="#6F7985" font-weight="normal" text-anchor="middle"><tspan x="572.5" dy="0.0">paper or online</tspan></text>
<text x="572.5" y="230.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="572.5" dy="0.0">Depends on mail or</tspan><tspan x="572.5" dy="22.1">internet access</tspan></text>
<text x="572.5" y="335.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="572.5" dy="0.0">No live help</tspan></text>
<text x="572.5" y="414.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="572.5" dy="0.0">Often more</tspan><tspan x="572.5" dy="22.1">private</tspan></text>
<text x="572.5" y="506.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="572.5" dy="0.0">Low cost; unclear</tspan><tspan x="572.5" dy="22.1">who answered</tspan></text>
