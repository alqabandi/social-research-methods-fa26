<text x="1062.5" y="158.0" font-size="16" fill="#6F7985" font-weight="normal" text-anchor="middle"><tspan x="1062.5" dy="0.0">a layer on any channel</tspan></text>
<text x="1062.5" y="230.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="1062.5" dy="0.0">Same coverage as</tspan><tspan x="1062.5" dy="22.1">the channel used</tspan></text>
<text x="1062.5" y="322.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="1062.5" dy="0.0">Depends on</tspan><tspan x="1062.5" dy="22.1">the channel</tspan></text>
<text x="1062.5" y="414.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="1062.5" dy="0.0">Self-entry</tspan><tspan x="1062.5" dy="22.1">can help</tspan></text>
<text x="1062.5" y="506.0" font-size="17" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="1062.5" dy="0.0">Setup cost; automatic</tspan><tspan x="1062.5" dy="22.1">paths and checks</tspan></text>
