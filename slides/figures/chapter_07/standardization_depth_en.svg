<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" xml:lang="en" lang="en" font-family='Arial, Helvetica, sans-serif'>
<title id="t">Survey and case study: standardization and depth as complementary strengths</title>
<desc id="d">A two-headed continuum runs from standardizing across many cases to going deep into a few. The survey panel shows many identical figures and lists standardization, comparability and coverage; it answers how many, how common, and whether groups differ, but can miss the meaning behind fixed options. The case study and in-depth interview panel shows one person in layers of context and lists context, process and meaning; it answers how things unfold and what they mean, but can miss breadth and comparison. Arrows between the panels show that depth sharpens survey questions and breadth shows how common a pattern is. The message: not more versus less scientific, but different kinds of evidence.</desc>
