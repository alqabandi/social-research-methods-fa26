<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" xml:lang="ar" lang="ar" direction="rtl" font-family='Arial, "Noto Sans Arabic", sans-serif'>
<title id="t">أربع طرق لجمع بيانات المسح مقارنة بأربعة معايير للقرار</title>
<desc id="d">جدول من أربعة أعمدة: المسح الهاتفي، والاستبانة الذاتية الورقية أو الإلكترونية، والمقابلة الشخصية المنظمة، والجمع بمساعدة الحاسوب، وقد رُسم بإطار متقطع لأنه طبقة تضاف إلى أي قناة. وتعرض أربعة صفوف إشارات قصيرة عن الوصول، والتوضيح، والخصوصية، والكلفة والضبط. مثلًا: الهاتف يصل إلى مناطق متباعدة لكن الأرقام المجهولة تُرفض، والاستبانة الذاتية بلا توضيح مباشر لكنها أكثر خصوصية أحيانًا، والمقابلة الشخصية تسمح بالمتابعة مع وجود المقابل، والحاسوب يضبط المسارات والتنبيهات لكنه يحتفظ بتغطية القناة نفسها. الملاحظة: لا يوجد ترتيب عام.</desc>
