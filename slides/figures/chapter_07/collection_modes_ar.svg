<text x="872.5" y="322.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="872.5" dy="0.0">يستطيع المقابل</tspan><tspan x="872.5" dy="24.7">التوضيح</tspan></text>
<text x="872.5" y="414.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="872.5" dy="0.0">قد يسمع الآخرون</tspan><tspan x="872.5" dy="24.7">المكالمة</tspan></text>
<text x="872.5" y="506.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="872.5" dy="0.0">أقل كلفة غالبًا؛</tspan><tspan x="872.5" dy="24.7">وإشراف مركزي</tspan></text>
