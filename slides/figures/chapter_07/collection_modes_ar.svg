<text x="382.5" y="158.0" font-size="16" fill="#6F7985" font-weight="normal" text-anchor="middle"><tspan x="382.5" dy="0.0">منظمة وجهًا لوجه</tspan></text>
<text x="382.5" y="230.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="382.5" dy="0.0">تتطلب تنقلًا؛ وتناسب</tspan><tspan x="382.5" dy="24.7">من يصعب عليه القراءة</tspan></text>
<text x="382.5" y="322.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="382.5" dy="0.0">توضيح</tspan><tspan x="382.5" dy="24.7">ومتابعة</tspan></text>
