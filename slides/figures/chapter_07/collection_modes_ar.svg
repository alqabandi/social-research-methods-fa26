<text x="627.5" y="158.0" font-size="16" fill="#6F7985" font-weight="normal" text-anchor="middle"><tspan x="627.5" dy="0.0">ورقية أو إلكترونية</tspan></text>
<text x="627.5" y="230.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="627.5" dy="0.0">تعتمد على البريد</tspan><tspan x="627.5" dy="24.7">أو الإنترنت</tspan></text>
<text x="627.5" y="335.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="627.5" dy="0.0">لا توضيح مباشر</tspan></text>
<text x="627.5" y="414.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="627.5" dy="0.0">خصوصية أعلى</tspan><tspan x="627.5" dy="24.7">أحيانًا</tspan></text>
<text x="627.5" y="506.0" font-size="19" fill="#25313D" font-weight="normal" text-anchor="middle"><tspan x="627.5" dy="0.0">كلفة أقل؛ ولا نعرف</tspan><tspan x="627.5" dy="24.7">دائمًا من أجاب</tspan></text>
